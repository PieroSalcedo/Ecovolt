# Server Configuration
server.port=8090
server.servlet.context-path=/ecovolt-api

# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/dbecv
spring.datasource.username=postgres
spring.datasource.password=pieroSC912
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson - Para que las fechas no se envíen como arrays, sino como strings legibles
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Spring Data JPA Auditing (Para que funcione el BaseEntity)
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud

# Desactivar el error "Open Session in View" (Mejora rendimiento)
spring.jpa.open-in-view=false

# Swagger UI Custom Path (Opcional)
springdoc.swagger-ui.path=/swagger-ui.html